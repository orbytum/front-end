user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
    multi_accept        on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" rt=$request_time';

    access_log  /var/log/nginx/access.log main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    server_tokens   off;

    # Estáticos pré-comprimidos no build (Dockerfile) são servidos direto;
    # gzip on fica como fallback para o que não tiver .gz ao lado.
    gzip_static  on;
    gzip         on;
    gzip_vary    on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff
        font/woff2;

    # Cache de metadados dos arquivos estáticos (menos syscalls por request).
    open_file_cache          max=1000 inactive=60s;
    open_file_cache_valid    60s;
    open_file_cache_min_uses 2;
    open_file_cache_errors   off;

    # DNS interno do Docker: o nome "api" é resolvido em tempo de requisição,
    # então o nginx sobe mesmo antes de a API estar disponível.
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen      80;
        listen      [::]:80;
        server_name _;

        root  /usr/share/nginx/html;
        index index.html;

        # Healthcheck do container.
        location = /healthz {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        # Assets versionados pelo Vite: cache imutável de 1 ano.
        location /assets/ {
            add_header Cache-Control "public, max-age=31536000, immutable";
            try_files $uri =404;
        }

        # Proxy da API: /api/xxxx -> http://api:8080/xxxx
        location /api {
            set $api_upstream api:8080;
            rewrite ^/api/?(.*)$ /$1 break;
            proxy_pass http://$api_upstream;

            proxy_http_version 1.1;
            proxy_set_header Connection       "";
            proxy_set_header Host             $host;
            proxy_set_header X-Real-IP        $remote_addr;
            proxy_set_header X-Forwarded-For  $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Uploads: combina com STORAGE_MAX_FILE_SIZE_BYTES (20 MB) da API.
            client_max_body_size    25m;
            proxy_request_buffering off;

            proxy_connect_timeout 10s;
            proxy_send_timeout    60s;
            proxy_read_timeout    60s;
        }

        # SPA: rotas do React Router caem no index.html.
        location / {
            try_files $uri $uri/ /index.html;
        }

        # index.html nunca em cache: um novo deploy é visto imediatamente.
        location = /index.html {
            add_header Cache-Control "no-cache, must-revalidate";
        }
    }
}
